; Ondas de la píldora de música (PildoraMusica.qml). Lee lo que sale por la salida predeterminada.
[general]
bars = 5
framerate = 20
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
