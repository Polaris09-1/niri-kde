[config]

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
[templates.niri]
input_path = "~/.config/matugen/templates/niri-colors.kdl"
output_path = "~/.config/niri/colors.kdl"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.mako]
input_path = "~/.config/matugen/templates/mako-config"
output_path = "~/.config/mako/config"

[templates.sddm]
input_path = "~/.config/matugen/templates/sddm-theme.conf"
output_path = "/usr/share/sddm/themes/niri-matugen/theme.conf"
[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock-config"
output_path = "~/.config/swaylock/config"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/hola/Colors.qml"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.sddm-astronaut]
input_path = "~/.config/matugen/templates/sddm-astronaut.conf"
output_path = "/usr/share/sddm/themes/sddm-astronaut-theme/Themes/matugen.conf"

# Apps GTK y Qt/KDE con los colores del fondo (2026-11-01). Después de matugen,
# wallpaper.sh corre ~/.local/bin/aplicar-colores-apps.sh (gsettings, kdeglobals, aviso a las apps).
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qt-colores.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt-colores.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kde]
input_path = "~/.config/matugen/templates/kde-colores.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

# Terminal (2026-11-01): prompt de starship y fastfetch con los colores del fondo
[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"
